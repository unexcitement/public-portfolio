[[terms]]
term = "Distributed Key Generation (DKG)"
definition = "Creating a cryptographic key in pieces across parties so no single party ever holds the whole private key."
projects = ["14"]
roles = ["security-engineering"]

[[terms]]
term = "Dual-Database Isolation"
definition = "Keeping credentials and audit data in a separate database from day-to-day business data, so routine backups and access never touch secrets."
