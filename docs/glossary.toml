# ---------------------------------------------------------------------------
# Roles. `flagship` is an ordered list of [project, why-it-matters] pairs.
# ---------------------------------------------------------------------------

[[roles]]
slug = "platform-operations"
title = "Platform Operations & SRE"
audience = "Hiring managers and engineers looking for infrastructure, platform, DevOps or site reliability experience."
summary = "Self-hosted clusters, isolation boundaries, provisioning automation and the operational tooling that keeps them observable and recoverable."
flagship = [
  ["07", "A multi-node LXD cluster with Raft quorum, OIDC, secret management, isolated egress and full observability."],
  ["06", "Kernel-level sandboxing for untrusted workloads: zero-egress firewalling, ZFS copy-on-write and GPU fencing."],
  ["20", "Idempotent bootstrapping that federates mixed hardware into one cluster without hand-copied certificates."],
  ["19", "Continuous pull-mirroring of source code onto self-hosted Gitea for supply-chain independence."],
  ["24", "A small, stateless container that turns telemetry into ChatOps alerts with rate-limit backoff."],
  ["01", "Infrastructure as code provisioning of the sandboxes behind an event-driven control surface."],
]

[[roles]]
slug = "software-engineering"
title = "Software Engineering (Backend & Distributed Systems)"
audience = "Engineering leads assessing backend, concurrency, data modelling and distributed systems depth."
summary = "Concurrency control, event-driven pipelines, protocol work and data models that stay correct under load."
flagship = [
  ["01", "Go ingress proxy, append-only SQLite WAL ledger and SSE fan-out with human approval gates."],
  ["02", "Binary protocol reverse-engineering: concurrent TCP proxying, in-memory raster decoding and OCR, failing open."],
  ["03", "Pessimistic locking, Redis reservations and BullMQ settlement to survive flash-sale spikes without double allocation."],
  ["05", "Schema-per-tenant PostgreSQL with transaction-scoped search_path and distributed RBAC."],
  ["08", "Optimistic concurrency with HTTP 409/428, dual-database isolation and an integer time grid."],
  ["10", "Goroutine worker pools and staged pruning across very large address spaces."],
]

[[roles]]
slug = "security-engineering"
title = "Security Engineering"
audience = "Security teams and CISOs looking for isolation, identity, secrets and audit design."
summary = "Defence in depth by architecture: isolation, least privilege, secret brokerage, cryptographic proofs and audit trails."
flagship = [
  ["06", "Zero-egress containment, CoW sandboxes and short-lived secrets for untrusted AI agents."],
  ["05", "Tenant isolation enforced at the database layer rather than in application WHERE clauses."],
  ["07", "Zero-trust identity with Authentik OIDC and OpenBao, plus namespace-isolated egress."],
  ["14", "Non-custodial key management and Merkle-batched on-chain notarisation."],
  ["18", "Keeping game-server admin ports off the internet behind an authenticated, audited bridge."],
  ["26", "Hazard Filtering: the redaction process used to publish this portfolio."],
]

[[roles]]
slug = "frontend-product"
title = "Frontend & Product Engineering"
audience = "Product teams looking for user-facing, real-time and interactive application work."
summary = "Interactive, real-time and server-rendered interfaces, from browser DSP to GIS dashboards to multi-brand SSR."
flagship = [
  ["15", "A modular synthesizer on the Web Audio API with voice stealing and sample-accurate automation."],
  ["09", "Leaflet GIS with live HLS thumbnails and alert states, packaged as a self-contained appliance."],
  ["12", "One Nuxt 3 SSR codebase serving several brands by inspecting the Host header."],
  ["16", "AST-driven expression transforms with invariant checks and a branching history timeline."],
  ["08", "A React 19 scheduling UI backed by conflict-safe edits and headless PDF export."],
  ["23", "A containerised Shopify theme toolchain with modular Liquid components."],
]

[[roles]]
slug = "solutions-architecture"
title = "Solutions Architecture & Technical Consulting"
audience = "Clients, founders and leadership looking for someone to translate business and social outcomes into systems."
summary = "Turning multi-stakeholder problems into delivered systems: commercial models, public-sector and non-profit outcomes, and systems thinking."
flagship = [
  ["05", "OASIS: a reusable SaaS foundation, the 'engine' in the Engine + Paint delivery model."],
  ["12", "A consultancy front door serving several brands and offerings from one footprint."],
  ["22", "Outcome ledgers that let a Community Interest Company report against grant funding."],
  ["21", "Dietary, routing and safeguarding requirements for vulnerable residents turned into an auditable workflow."],
  ["04", "Modelling cognitive load and capacity across organisations for clinical and leadership use."],
  ["26", "Dual-paradigm documentation: every system explained as topology and as Stocks & Flows."],
]

# ---------------------------------------------------------------------------
# Terms. roles must match a role slug above; projects are catalog numbers.
# ---------------------------------------------------------------------------

[[terms]]
term = "Abstract Syntax Tree (AST)"
definition = "A tree representation of an expression or program. Transforming the tree rather than the text keeps every change structurally valid."
projects = ["16"]
roles = ["software-engineering", "frontend-product"]

[[terms]]
term = "Adaptive Bitrate Streaming (HLS)"
definition = "Video split into short segments at several quality levels so each viewer's player can switch quality to match their connection."
projects = ["13", "09"]
roles = ["software-engineering", "frontend-product"]

[[terms]]
term = "Append-Only Ledger"
definition = "A store where records are only ever added, never edited or deleted, so history can be replayed and audited."
projects = ["01", "03", "16", "18", "21", "22"]
roles = ["software-engineering", "security-engineering"]

[[terms]]
term = "Applied Systems Theory (Stocks & Flows)"
definition = "Donella Meadows' method of modelling a system as stocks (things that accumulate), flows (rates that change them) and feedback loops. Every project profile includes one of these diagrams."
projects = ["26", "01", "04"]
roles = ["solutions-architecture"]

[[terms]]
term = "Audit Trail"
definition = "A tamper-evident record of who did what and when, kept so decisions can be reviewed by regulators, funders or operators."
projects = ["03", "08", "18", "21", "22"]
roles = ["security-engineering", "solutions-architecture"]

[[terms]]
term = "Backpressure"
definition = "Slowing or shedding incoming work when a downstream stage is full, instead of letting queues grow until something breaks."
projects = ["01", "02", "24"]
roles = ["software-engineering", "platform-operations"]

[[terms]]
term = "ChatOps"
definition = "Running operational alerts and actions through team chat so the whole team sees system state where they already work."
projects = ["24"]
roles = ["platform-operations"]

[[terms]]
term = "Community Interest Company (CIC)"
definition = "A UK social-enterprise company type that must show its activity benefits the community, which drives statutory outcome reporting."
projects = ["22"]
roles = ["solutions-architecture"]

[[terms]]
term = "Connection Pooling"
definition = "Reusing a fixed set of open database connections instead of opening one per request, which caps load and cuts latency."
projects = ["25", "17"]
roles = ["software-engineering"]

[[terms]]
term = "Copy-on-Write (CoW) Snapshots"
definition = "Filesystem snapshots (here ZFS) that share unchanged blocks, so a fresh sandbox can be cloned in seconds and thrown away cleanly."
projects = ["06"]
roles = ["platform-operations", "security-engineering"]

[[terms]]
term = "Data Sovereignty"
definition = "Keeping control of where data and code live and who can reach them, enforced by architecture (self-hosting, isolation, mirrors) rather than by vendor policy."
