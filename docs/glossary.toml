[[terms]]
term = "Defence in Depth"
definition = "Layering independent controls (network, kernel, identity, application, audit) so one failure does not expose the whole system."
projects = ["05", "06", "07", "18"]
roles = ["security-engineering"]

[[terms]]
term = "DEFCON 0 (Zero-Egress Containment)"
definition = "This portfolio's name for a sandbox whose outbound internet access is dropped at the host firewall by default and only allowed through named, isolated tunnels."
